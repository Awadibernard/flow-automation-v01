<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Automation V0.1.4</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Flow Automation <span class="badge">V0.1.4</span></h1>
  </header>

  <!-- Statut détaillé de la page (état distinct et lisible) -->
  <section id="status-panel">
    <div id="page-status" class="status">Vérification…</div>
    <div id="status-detail" class="status-detail"></div>
    <div id="status-actions" class="status-actions">
      <button id="btn-recheck" class="mini">Revérifier</button>
      <button id="btn-diagnose" class="mini">Diagnostic</button>
    </div>
  </section>

  <main>
    <section class="card">
      <label for="prompts">Prompts (un par ligne)</label>
      <textarea id="prompts" rows="5" placeholder="Un prompt par ligne&#10;Exemple : A cat in a spaceship, cinematic light"></textarea>
    </section>

    <section class="card" id="settings-section">
      <details>
        <summary>Paramètres</summary>
        <div class="setting-row">
          <label for="set-model">Modèle</label>
          <input id="set-model" type="text" placeholder="Laisser vide = défaut">
        </div>
        <div class="setting-row">
          <label for="set-ratio">Format / ratio</label>
          <input id="set-ratio" type="text" placeholder="ex : 16:9">
        </div>
        <div class="setting-row">
          <label for="set-count">Nombre de résultats</label>
          <input id="set-count" type="number" min="1" max="4" placeholder="ex : 1">
        </div>
        <div class="setting-row">
          <label for="set-folder">Dossier de téléchargement</label>
          <input id="set-folder" type="text" value="flow-automation">
        </div>
        <p class="hint">Modèle / Ratio / Nombre ne sont PAS encore appliqués à Google Flow
        dans cette version.</p>
      </details>
    </section>

    <section class="controls">
      <button id="btn-start" class="primary">Démarrer</button>
      <button id="btn-pause" disabled>Pause</button>
      <button id="btn-resume" disabled>Reprendre</button>
      <button id="btn-cancel" disabled>Annuler</button>
    </section>

    <section class="card">
      <div class="progress-row">
        <span id="queue-progress">0 / 0</span>
        <span id="current-prompt">—</span>
      </div>
    </section>

    <section class="card" id="queue-list">
      <h2>File d'attente</h2>
      <ul id="queue-items"></ul>
    </section>

    <!-- Rapport de diagnostic (affiché sur demande) -->
    <section class="card" id="diag-card" style="display:none">
      <h2>Rapport de diagnostic</h2>
      <pre id="diag-report"></pre>
      <button id="btn-copy-diag" class="mini">Copier le rapport</button>
    </section>

    <section class="card">
      <details open>
        <summary>Logs</summary>
        <pre id="log-area"></pre>
      </details>
    </section>
  </main>

  <script src="status.js"></script>
  <script src="storage-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
